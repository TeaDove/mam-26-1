steel alloy contributes to increased strength and structural integrity, particularly during the hot rolling process\u2014a critical phase in steel manufacturing that influences the final properties of ...", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "HIGH TEMPERATURES", "label": "HIGH TEMPERATURES", "shape": "dot", "title": "HIGH TEMPERATURES\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nValues of temperature elevated significantly, affecting the behavior of materials during deformation processes such as recrystallization and recovery.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PEAK STRESS", "label": "PEAK STRESS", "shape": "dot", "title": "PEAK STRESS\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 1\nThe maximum stress that a material can withstand during deformation before it begins to soften or fail.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "METADYNAMIC RECRYSTALLIZATION", "label": "METADYNAMIC RECRYSTALLIZATION", "shape": "dot", "title": "METADYNAMIC RECRYSTALLIZATION\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nA process occurring after dynamic recrystallization where new grain structures form during a holding period at temperature.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "INITIAL GRAIN SIZE", "label": "INITIAL GRAIN SIZE", "shape": "dot", "title": "INITIAL GRAIN SIZE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nThe size of the grains in a material before undergoing deformation, which significantly impacts the outcome of recrystallization.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PLAIN C STEEL", "label": "PLAIN C STEEL", "shape": "dot", "title": "PLAIN C STEEL\ntype: STEEL GRADE\nsource: tanaka1981\ndegree: 1\nPlain C steel is a type of steel known for its properties under static recrystallization and is used in various applications due to its structural integrity.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "NB STEEL", "label": "NB STEEL", "shape": "dot", "title": "NB STEEL\ntype: STEEL GRADE\nsource: tanaka1981\ndegree: 2\nNB STEEL is a specialized type of steel that is alloyed with niobium, which significantly enhances its mechanical properties. This unique steel is recognized for its remarkable strength and toughness, particularly after undergoing deformation processes. These characteristics make NB STEEL highly valuable in various applications requiring both durability and resilience.\n\nIn addition to its strength...", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ROLLING", "label": "ROLLING", "shape": "dot", "title": "ROLLING\ntype: PROCESS\nsource: tanaka1981\ndegree: 2\nRolling is a metal forming process wherein metal is passed through rolls to reduce thickness, improve surface finish, and achieve desired mechanical properties.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DEFORMATION TEMPERATURE", "label": "DEFORMATION TEMPERATURE", "shape": "dot", "title": "DEFORMATION TEMPERATURE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 3\nDeformation temperature is a crucial parameter that affects the recrystallization behavior and mechanical properties of metals during processes like rolling.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CRITICAL AMOUNT OF DEFORMATION", "label": "CRITICAL AMOUNT OF DEFORMATION", "shape": "dot", "title": "CRITICAL AMOUNT OF DEFORMATION\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nThe critical amount of deformation refers to the minimum strain required to initiate recrystallization during metal processing.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ALPHA GRAIN", "label": "ALPHA GRAIN", "shape": "dot", "title": "ALPHA GRAIN\ntype: PHASE\nsource: tanaka1981\ndegree: 1\nAlpha grain refers to a specific microstructural phase in steel that can influence its mechanical properties such as toughness and ductility.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "GRAIN-BOUNDARY MIGRATION", "label": "GRAIN-BOUNDARY MIGRATION", "shape": "dot", "title": "GRAIN-BOUNDARY MIGRATION\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nGrain-boundary migration is a phenomenon that describes the movement of grain boundaries due to various driving forces in materials science, crucial for understanding recrystallization.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PARTIAL RECRYSTALLIZATION REGION", "label": "PARTIAL RECRYSTALLIZATION REGION", "shape": "dot", "title": "PARTIAL RECRYSTALLIZATION REGION\ntype: PHASE\nsource: tanaka1981\ndegree: 1\nThe partial recrystallization region is a phase where some grains have recrystallized while others have not, affecting the overall material characteristics.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "UNIQUENESS OF GRAIN STRUCTURE", "label": "UNIQUENESS OF GRAIN STRUCTURE", "shape": "dot", "title": "UNIQUENESS OF GRAIN STRUCTURE\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 1\nUniqueness of grain structure pertains to the distinct lattice arrangements within metal grains that significantly affect performance metrics.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "C STEEL", "label": "C STEEL", "shape": "dot", "title": "C STEEL\ntype: STEEL GRADE\nsource: tanaka1981\ndegree: 1\nPlain C steel is a type of steel used in various applications but exhibits sluggish recrystallization at low temperatures in the gamma region.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TEMPERATURE", "label": "TEMPERATURE", "shape": "dot", "title": "TEMPERATURE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 2\nTemperature is a crucial parameter in materials science that significantly influences various processes and characteristics of materials. It plays an essential role in the kinetics of recrystallization and precipitation processes, which are fundamental to the manipulation and enhancement of material properties. Specifically, temperature affects phase transformations and the mechanical properties o...", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "LOW-TEMPERATURE TOUGHNESS", "label": "LOW-TEMPERATURE TOUGHNESS", "shape": "dot", "title": "LOW-TEMPERATURE TOUGHNESS\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 2\nLow-temperature toughness is an essential mechanical property of materials that signifies their ability to absorb energy and undergo plastic deformation when subjected to low temperatures. This property is critical in determining the performance and reliability of materials in cold environments, where they are subjected to various stress conditions. Low-temperature toughness indicates how well a m...", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "HOLDING TIME", "label": "HOLDING TIME", "shape": "dot", "title": "HOLDING TIME\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nHolding time in the context of heat treatment affects the grain size and properties of steel during processes like recrystallization.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SOLUTE NB", "label": "SOLUTE NB", "shape": "dot", "title": "SOLUTE NB\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 1\nSolute Nb influences the incubation time for the start of recrystallization and affects the delayed recrystallization process when alloyed with steel.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "FINE NB(C,N)", "label": "FINE NB(C,N)", "shape": "dot", "title": "FINE NB(C,N)\ntype: PHASE\nsource: tanaka1981\ndegree: 1\nFine Nb(C,N) precipitates that occur during the deformation process, notably influencing the kinetics of recrystallization in Nb-modified steel.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TIME CONSTANT", "label": "TIME CONSTANT", "shape": "dot", "title": "TIME CONSTANT\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nThe time constant is a parameter in Avrami\u0027s law that describes the time required for a fraction of a material to undergo recrystallization.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "GRAIN REFINEMENT", "label": "GRAIN REFINEMENT", "shape": "dot", "title": "GRAIN REFINEMENT\ntype: PROCESS\nsource: tanaka1981\ndegree: 8\nGrain refinement is a fundamental process primarily aimed at reducing the size of grains within the microstructure of materials, particularly steel. This strategic reduction of grain size is significant as it enhances the mechanical properties of the final product. \n\nThe primary objective of grain refinement is to produce finer grains that can substantially improve a material\u0027s strength, toughness...", "value": 16.153846153846153}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "AVRAMI\u0027S LAW", "label": "AVRAMI\u0027S LAW", "shape": "dot", "title": "AVRAMI\u0027S LAW\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nAvrami\u0027s Law mathematically describes the fraction of material that has undergone a transformation over time, often used in phase transitions such as recrystallization.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "OHMORI", "label": "OHMORI", "shape": "dot", "title": "OHMORI\ntype: PERSON\nsource: tanaka1981\ndegree: 1\nOhmori is a researcher who suggested the retarding effect due to fine precipitation in the context of recrystallization and deformation.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "LE BON ET AL.", "label": "LE BON ET AL.", "shape": "dot", "title": "LE BON ET AL.\ntype: PERSON\nsource: tanaka1981\ndegree: 1\nLe Bon et al. provided insights into the recrystallization kinetics of Nb-modified steel and contributed to the understanding of precipitation processes.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "NON-RECRYSTALLIZATION REGION", "label": "NON-RECRYSTALLIZATION REGION", "shape": "dot", "title": "NON-RECRYSTALLIZATION REGION\ntype: PHASE\nsource: tanaka1981\ndegree: 5\nThe \"non-recrystallization region\" in the steel rolling process refers to a specific temperature range where the steel material undergoes deformation without undergoing recrystallization. This region significantly influences the final microstructure and mechanical properties of the steel being processed. During this phase of deformation, the absence of recrystallization indicates a limitation to t...", "value": 13.846153846153847}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DENSITY", "label": "DENSITY", "shape": "dot", "title": "DENSITY\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nDensity is a physical property that is affected by the temperature during deformation processes, particularly in the non-recrystallization region.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "GRAIN-BOUNDARY AREA", "label": "GRAIN-BOUNDARY AREA", "shape": "dot", "title": "GRAIN-BOUNDARY AREA\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 1\nGrain-boundary area refers to the total surface area at the boundary between grains, which can affect material strength and behavior under deformation.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "GAMMA-GRAIN", "label": "GAMMA-GRAIN", "shape": "dot", "title": "GAMMA-GRAIN\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 3\nGamma-grains are a specific type of microstructural feature that plays a critical role in the mechanical properties of steel, especially when affected by deformation.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ALPHA-GRAIN", "label": "ALPHA-GRAIN", "shape": "dot", "title": "ALPHA-GRAIN\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 2\nAlpha-grains refer to the ferritic structure that forms during the transformation of austenite, affecting the material\u0027s overall mechanical properties.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ASTM GRAIN-SIZE NUMBER", "label": "ASTM GRAIN-SIZE NUMBER", "shape": "dot", "title": "ASTM GRAIN-SIZE NUMBER\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nASTM grain-size number is a quantitative measure that indicates the average size of grains in a material, significant for assessing material properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ROLLED MATERIAL", "label": "ROLLED MATERIAL", "shape": "dot", "title": "ROLLED MATERIAL\ntype: MATERIAL\nsource: tanaka1981\ndegree: 1\nRolled material refers to metal that has been shaped and altered through the rolling process, often affecting its microstructural properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TRANSFORMATION RATE", "label": "TRANSFORMATION RATE", "shape": "dot", "title": "TRANSFORMATION RATE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nTransformation rate is the speed at which the phase change occurs in materials during processing, significantly affecting overall material attributes.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "NUCLEATION RATE", "label": "NUCLEATION RATE", "shape": "dot", "title": "NUCLEATION RATE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 2\nNucleation rate is the rate at which new grains form during the phase transformation, influencing microstructural evolution.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "INTERFACE NUCLEATION GROWTH MECHANISM", "label": "INTERFACE NUCLEATION GROWTH MECHANISM", "shape": "dot", "title": "INTERFACE NUCLEATION GROWTH MECHANISM\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nThe interface nucleation growth mechanism describes how new grain boundaries are formed and grow during phase transformations in materials.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TWO-PHASE REGION", "label": "TWO-PHASE REGION", "shape": "dot", "title": "TWO-PHASE REGION\ntype: PHASE\nsource: tanaka1981\ndegree: 4\nThe two-phase region is a critical temperature range in which two distinct phases, specifically austenite and ferrite, coexist within steel materials. This region significantly influences the mechanical properties and microstructure of the steel during various deformation processes. The presence of both phases in the two-phase region alters the behavior of the material, impacting its strength, duc...", "value": 13.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "MICROSTRUCTURE", "label": "MICROSTRUCTURE", "shape": "dot", "title": "MICROSTRUCTURE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 7\nMicrostructure pertains to the small-scale structural characteristics of materials, particularly emphasizing its critical role in assessing the mechanical properties of alloys. This concept encompasses the microscopic arrangement and organization of various components within a material, influencing both its mechanical properties and its behavior during various processes. Understanding microstructu...", "value": 15.384615384615385}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "YIELD STRENGTH", "label": "YIELD STRENGTH", "shape": "dot", "title": "YIELD STRENGTH\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 11\nYield strength is defined as the stress level at which a material begins to undergo plastic deformation, transitioning from elastic behavior to permanent deformation. This property is crucial for evaluating the performance of materials, especially in structural applications. When the yield strength is reached, the material will no longer return to its original shape upon the removal of the applied...", "value": 18.46153846153846}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TENSILE STRENGTH", "label": "TENSILE STRENGTH", "shape": "dot", "title": "TENSILE STRENGTH\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 2\nTensile strength refers to the maximum amount of tensile (stretching) stress that a material can withstand before experiencing failure. This property is particularly significant in the context of steel alloys, where it serves as a critical measure of performance and durability. Understanding the tensile strength of materials is vital for engineers and designers, as it helps in selecting appropriat...", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TRANSITION TEMPERATURE", "label": "TRANSITION TEMPERATURE", "shape": "dot", "title": "TRANSITION TEMPERATURE\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 5\nTransition temperature refers to the temperature at which transformations occur in steel, affecting its properties and microstructure during processing.", "value": 13.846153846153847}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ABSORBED ENERGY", "label": "ABSORBED ENERGY", "shape": "dot", "title": "ABSORBED ENERGY\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 1\nAbsorbed energy is the energy a material can absorb before fracturing, often measured in impact tests.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "EQUIAXED ALPHA GRAINS", "label": "EQUIAXED ALPHA GRAINS", "shape": "dot", "title": "EQUIAXED ALPHA GRAINS\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nEquiaxed alpha grains refer to a specific grain structure that is roughly equal in all dimensions, which contributes to improved material properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "STAIN-INDUCED TRANSFORMATION", "label": "STAIN-INDUCED TRANSFORMATION", "shape": "dot", "title": "STAIN-INDUCED TRANSFORMATION\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nStrain-induced transformation is a phenomenon where the material undergoes a phase change due to applied mechanical strain.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "AUSTENITE-FERRITE REGION", "label": "AUSTENITE-FERRITE REGION", "shape": "dot", "title": "AUSTENITE-FERRITE REGION\ntype: PHASE\nsource: tanaka1981\ndegree: 1\nThe austenite-ferrite region refers to a specific temperature range in steels where both austenite and ferrite phases coexist and interact during processing.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "NB(C, N)", "label": "NB(C, N)", "shape": "dot", "title": "NB(C, N)\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 1\nNb(C, N) refers to niobium carbide and niobium nitride, which are precipitates that can improve the mechanical properties of steel.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "LIMITING VALUE", "label": "LIMITING VALUE", "shape": "dot", "title": "LIMITING VALUE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nLimiting value indicates the maximum extent of grain refinement achievable through deformation in specified conditions.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "OPTICAL MICROSCOPIC SCALE", "label": "OPTICAL MICROSCOPIC SCALE", "shape": "dot", "title": "OPTICAL MICROSCOPIC SCALE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nThe optical microscopic scale refers to measurements and observations of microstructures that can be captured using optical microscopy techniques.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ELECTRON MICROSCOPIC SCALE", "label": "ELECTRON MICROSCOPIC SCALE", "shape": "dot", "title": "ELECTRON MICROSCOPIC SCALE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nElectron microscopic scale involves more detailed examinations of microstructures using electron microscopy, allowing for higher resolution insights.)(\"relationship\"", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DILATOMETRIC METHODS", "label": "DILATOMETRIC METHODS", "shape": "dot", "title": "DILATOMETRIC METHODS\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nDilatometric methods are used to measure changes in dimension of materials as a function of temperature, typically employed to study thermal expansion and phase transitions in metals and alloys.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "STRAIN-INDUCED AR3 TEMPERATURE", "label": "STRAIN-INDUCED AR3 TEMPERATURE", "shape": "dot", "title": "STRAIN-INDUCED AR3 TEMPERATURE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 2\nThe strain-induced Ar3 temperature refers to the temperature at which austenite transforms into ferrite during the cooling process under deformation, which is critical in the heat treatment of steel.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "MARTENSITE", "label": "MARTENSITE", "shape": "dot", "title": "MARTENSITE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 5\nMartensite is a hard and brittle microstructure that forms in steel during the rapid cooling of austenite, a phase of iron and steel that is typically stable at high temperatures. This transformation occurs through a process known as quenching, where the temperature of the austenite is quickly lowered, leading to a significant increase in the material\u2019s strength and hardness.\n\nThe formation of mar...", "value": 13.846153846153847}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "POLYGONAL FERRITE-PEARLITE", "label": "POLYGONAL FERRITE-PEARLITE", "shape": "dot", "title": "POLYGONAL FERRITE-PEARLITE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nPolygonal ferrite-pearlite is a microstructure found in steel consisting of alternating layers of ferrite and cementite, typically resulting in a balance of strength and ductility.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ACICULAR FERRITE", "label": "ACICULAR FERRITE", "shape": "dot", "title": "ACICULAR FERRITE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 8\nAcicular ferrite is a specialized form of ferrite noted for its unique, fine, needle-like microstructure, which significantly improves the toughness and strength of steel, especially in applications involving welded structures. This microstructure is primarily formed during controlled rolling processes, where it develops at lower temperatures, thus contributing to the enhanced mechanical propertie...", "value": 16.153846153846153}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TEXTURE DEVELOPMENT", "label": "TEXTURE DEVELOPMENT", "shape": "dot", "title": "TEXTURE DEVELOPMENT\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 3\nTexture development refers to the evolution of crystallographic orientation in materials, significantly affecting their mechanical and physical properties during processing like rolling or forging.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TEXTURE INTENSITY", "label": "TEXTURE INTENSITY", "shape": "dot", "title": "TEXTURE INTENSITY\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nTexture intensity quantifies the degree of preferred orientation of grains in a polycrystalline material, affecting its anisotropic mechanical properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "YUTORI AND OGAWA", "label": "YUTORI AND OGAWA", "shape": "dot", "title": "YUTORI AND OGAWA\ntype: PERSON\nsource: tanaka1981\ndegree: 1\nYutori and Ogawa are researchers who studied the effects of processing conditions on the microstructure and properties of controlled-rolled steels.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TANAKA AND TABATA", "label": "TANAKA AND TABATA", "shape": "dot", "title": "TANAKA AND TABATA\ntype: PERSON\nsource: tanaka1981\ndegree: 1\nTanaka and Tabata are researchers who reported on the determination of Ar3 temperature in steels based on texture intensity measurements and controlled-rolling conditions.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TRANSFORMED MICROSTRUCTURE", "label": "TRANSFORMED MICROSTRUCTURE", "shape": "dot", "title": "TRANSFORMED MICROSTRUCTURE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nTransformed microstructure refers to the microstructural changes that occur during heating and cooling of steel, and is critical in determining the final mechanical properties of the material.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "HEAVY DEFORMATION", "label": "HEAVY DEFORMATION", "shape": "dot", "title": "HEAVY DEFORMATION\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nHeavy deformation refers to significant plastic deformation applied to materials to improve their mechanical characteristics and to alter their microstructure, such as during processes like rolling or forging.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CRYSTALLOGRAPHIC TEXTURE", "label": "CRYSTALLOGRAPHIC TEXTURE", "shape": "dot", "title": "CRYSTALLOGRAPHIC TEXTURE\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nCrystallographic texture describes the preferred orientation of grains in a polycrystalline material, which greatly influences its mechanical properties and response to processing.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ROLLING DIRECTION (RD)", "label": "ROLLING DIRECTION (RD)", "shape": "dot", "title": "ROLLING DIRECTION (RD)\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nRolling direction is the orientation of a material as it undergoes rolling processes, significantly affecting the texture and mechanical properties achieved in the final product.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "NORMALIZED STEEL", "label": "NORMALIZED STEEL", "shape": "dot", "title": "NORMALIZED STEEL\ntype: STEEL GRADE\nsource: tanaka1981\ndegree: 1\nNormalized steel refers to steel that has been heat-treated to refine its microstructure to achieve a more uniform quality and improve its mechanical performance.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "QUENCHED AND TEMPERED STEEL", "label": "QUENCHED AND TEMPERED STEEL", "shape": "dot", "title": "QUENCHED AND TEMPERED STEEL\ntype: STEEL GRADE\nsource: tanaka1981\ndegree: 1\nQuenched and tempered steel is steel that has undergone hardening by quenching followed by tempering, enhancing its strength and toughness for various applications.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CONTROLLED-ROLLED STEEL", "label": "CONTROLLED-ROLLED STEEL", "shape": "dot", "title": "CONTROLLED-ROLLED STEEL\ntype: MATERIAL\nsource: tanaka1981\ndegree: 17\nControlled-rolled steel is a specialized type of steel characterized by its unique mechanical properties, which are significantly influenced by its rolling process. This type of steel is produced through specific rolling practices designed to enhance certain attributes, such as grain size and toughness. \n\nOne important aspect of controlled-rolled steel is its anisotropic nature, meaning that its p...", "value": 23.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PLANE ANISOTROPY", "label": "PLANE ANISOTROPY", "shape": "dot", "title": "PLANE ANISOTROPY\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 3\nPlane anisotropy is a concept that denotes the directional dependency of mechanical properties in materials, particularly in relation to the microstructural development observed in rolled steel. This phenomenon plays a crucial role in determining how materials respond under various loads and conditions, significantly influencing their strength and fracture behavior.\n\nIn the context of rolled steel...", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "EMBRITTLEMENT", "label": "EMBRITTLEMENT", "shape": "dot", "title": "EMBRITTLEMENT\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 3\nEmbrittlement is a reduction in ductility, causing a material to fracture easier, particularly influenced by the formation of certain crystal textures.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TEXTURE", "label": "TEXTURE", "shape": "dot", "title": "TEXTURE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nTexture in materials science describes the orientation distribution of grains within a material, significantly affecting its mechanical properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CHARPY IMPACT ENERGY", "label": "CHARPY IMPACT ENERGY", "shape": "dot", "title": "CHARPY IMPACT ENERGY\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 4\nCharpy impact energy measures a material\u0027s toughness and is evaluated using standardized specimen tests to assess energy absorption during fracture.", "value": 13.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "LONGITUDINAL DIRECTION", "label": "LONGITUDINAL DIRECTION", "shape": "dot", "title": "LONGITUDINAL DIRECTION\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 3\nThe longitudinal direction in materials refers to the direction of rolling or lengthwise orientation, influencing material properties.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "THROUGH-THICKNESS DIRECTION", "label": "THROUGH-THICKNESS DIRECTION", "shape": "dot", "title": "THROUGH-THICKNESS DIRECTION\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 2\nThe through-thickness direction refers to the orientation perpendicular to the plane of a material sample, critical in evaluating properties such as strength and embrittlement.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TRANSVERSE DIRECTION", "label": "TRANSVERSE DIRECTION", "shape": "dot", "title": "TRANSVERSE DIRECTION\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 2\nThe transverse direction is perpendicular to the rolling direction and affects the mechanical properties of materials in distinct ways.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CHARPY CURVES", "label": "CHARPY CURVES", "shape": "dot", "title": "CHARPY CURVES\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nCharpy curves represent the relationship between impact energy and temperature in materials, showing how toughness varies.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SEPARATIONS", "label": "SEPARATIONS", "shape": "dot", "title": "SEPARATIONS\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 9\nSeparations refer to defects observed in materials, particularly during mechanical testing. These defects signify a weak structural integrity, which is critical for evaluating the performance and reliability of materials under various conditions. The occurrence of separations is notably linked to the development of cracks in steel, which can arise due to anisotropy in fracture strength. Anisotropy...", "value": 16.923076923076923}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CLEAVAGE FRACTURE", "label": "CLEAVAGE FRACTURE", "shape": "dot", "title": "CLEAVAGE FRACTURE\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nCleavage fracture is a brittle fracture that can occur in materials, particularly metals, under certain stress conditions, often influenced by microstructural characteristics.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "MNS INCLUSION", "label": "MNS INCLUSION", "shape": "dot", "title": "MNS INCLUSION\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 2\nManganese sulfide (MnS) inclusion is an impurity found in steel that can trigger crack initiation and propagation, affecting the material\u0027s mechanical properties.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "UNIAXIAL YIELD STRESS", "label": "UNIAXIAL YIELD STRESS", "shape": "dot", "title": "UNIAXIAL YIELD STRESS\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 1\nUniaxial yield stress is the stress required to deform a material plastically in a uniaxial stress state, a critical parameter in material performance.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TEMPER EMBRITTLEMENT", "label": "TEMPER EMBRITTLEMENT", "shape": "dot", "title": "TEMPER EMBRITTLEMENT\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nTemper embrittlement is a phenomenon in metals where brittleness is increased due to segregation of impurities at grain boundaries during heat treatment.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "GRAIN BOUNDARY", "label": "GRAIN BOUNDARY", "shape": "dot", "title": "GRAIN BOUNDARY\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nGrain boundaries are interfaces between individual crystals or grains in a material, significantly influencing its mechanical and physical properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "RARE EARTH METALS", "label": "RARE EARTH METALS", "shape": "dot", "title": "RARE EARTH METALS\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 2\nRare earth metals are a collective group of 17 chemical elements known for their significant role in enhancing the properties of various materials, particularly steels. These elements contribute to modifying the shape of inclusions within steel, which is critical for improving its overall performance. In addition to their application in steel production, rare earth metals are utilized in small qua...", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DESULPHURIZATION METHOD", "label": "DESULPHURIZATION METHOD", "shape": "dot", "title": "DESULPHURIZATION METHOD\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nDesulphurization methods are processes designed to reduce sulfur content in steel, aiming to prevent embrittlement from sulfide inclusions.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DIMENSIONAL ANISOTROPY", "label": "DIMENSIONAL ANISOTROPY", "shape": "dot", "title": "DIMENSIONAL ANISOTROPY\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nDimensional anisotropy is a property of materials where mechanical properties vary depending on the direction of measurement, often observed in rolled steels.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CRACK INITIATION", "label": "CRACK INITIATION", "shape": "dot", "title": "CRACK INITIATION\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nCrack initiation is the process whereby a crack begins to form in a material, often influenced by stress concentrations and microstructural features.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "HOTPROLLED STRIP", "label": "HOTPROLLED STRIP", "shape": "dot", "title": "HOTPROLLED STRIP\ntype: MATERIAL\nsource: tanaka1981\ndegree: 1\nHot-rolled strip is a product of steel processing involving rolling at high temperatures, which affects its microstructure and mechanical properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PLANE STRAIN", "label": "PLANE STRAIN", "shape": "dot", "title": "PLANE STRAIN\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nPlane strain is a condition in which deformation occurs primarily in a plane, significant in understanding yielding and failure in materials.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PLANE STRESS", "label": "PLANE STRESS", "shape": "dot", "title": "PLANE STRESS\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nPlane stress is a condition where the stress in the thickness direction of a material is negligible, affecting the analysis of stress and strains during manufacturing.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PROPAGATE", "label": "PROPAGATE", "shape": "dot", "title": "PROPAGATE\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nPropagate refers to the propagation of cracks or defects in materials, a critical aspect of understanding failure mechanisms in engineering materials.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CONTROLLED-ROLLED STEELS", "label": "CONTROLLED-ROLLED STEELS", "shape": "dot", "title": "CONTROLLED-ROLLED STEELS\ntype: MATERIAL\nsource: tanaka1981\ndegree: 3\nControlled-rolled steels are materials processed under specific temperature and deformation conditions to achieve desirable mechanical properties such as increased strength and toughness.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SULPHIDE", "label": "SULPHIDE", "shape": "dot", "title": "SULPHIDE\ntype: MATERIAL\nsource: tanaka1981\ndegree: 2\nSulphides are impurities in steels that can negatively impact mechanical properties, and controlling their shape is crucial for enhancing the final product quality.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "MARTENSITIC STRUCTURE", "label": "MARTENSITIC STRUCTURE", "shape": "dot", "title": "MARTENSITIC STRUCTURE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 2\nMartensitic structure in steel indicates a specific microstructure formed by rapid cooling, which results in increased hardness and strength.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DUCTILE-TO-BRITTLE TRANSITION TEMPERATURE", "label": "DUCTILE-TO-BRITTLE TRANSITION TEMPERATURE", "shape": "dot", "title": "DUCTILE-TO-BRITTLE TRANSITION TEMPERATURE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nThe ductile-to-brittle transition temperature is a critical thermal parameter that plays a significant role in materials science, particularly in evaluating the performance of metals and alloys under varying temperature conditions. This temperature serves as a threshold, indicating the specific temperature range within which a material transitions from ductile behavior, characterized by the abilit...", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "EFFECTIVE GRAIN SIZE", "label": "EFFECTIVE GRAIN SIZE", "shape": "dot", "title": "EFFECTIVE GRAIN SIZE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 2\nEffective grain size is a key concept in material science that refers to the size of grains within a material that significantly impacts its mechanical properties during processing. This measurement is particularly important in understanding the behavior of materials, especially those containing martensitic phases. In these materials, the effective grain size plays a crucial role in determining th...", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SEPARATION", "label": "SEPARATION", "shape": "dot", "title": "SEPARATION\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nSeparation refers to the phenomenon where internal flaws or microstructural changes propagate under stress, impacting the integrity of materials.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "BAND DENSITY", "label": "BAND DENSITY", "shape": "dot", "title": "BAND DENSITY\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nBand density is a measure of the number of bands (or clusters of grains) within a microstructure, which influences material properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CR", "label": "CR", "shape": "dot", "title": "CR\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 1\nChromium is an alloying element that helps to improve the hardness and corrosion resistance of steel.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PRECIPITATION HARDENING", "label": "PRECIPITATION HARDENING", "shape": "dot", "title": "PRECIPITATION HARDENING\ntype: PROCESS\nsource: tanaka1981\ndegree: 2\nPrecipitation hardening is a specialized heat treatment process utilized in metallurgy to enhance the strength and hardness of materials. This process involves the formation of fine, dispersed particles within the metallic matrix of the material. These particles serve to impede the movement of dislocations, which are defects in the crystal structure that can lead to material deformation under stre...", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "LATTICE HARDENING", "label": "LATTICE HARDENING", "shape": "dot", "title": "LATTICE HARDENING\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nLattice hardening refers to the strengthening of materials through alterations in the lattice structure that impede the movement of dislocations.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SOLID-SOLUTION HARDENING", "label": "SOLID-SOLUTION HARDENING", "shape": "dot", "title": "SOLID-SOLUTION HARDENING\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nSolid-solution hardening is achieved by adding solute atoms to a metal, which distorts the crystal lattice and makes it harder for dislocations to move.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TEXTURE HARDENING", "label": "TEXTURE HARDENING", "shape": "dot", "title": "TEXTURE HARDENING\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nTexture hardening occurs when the crystallographic texture of a material is altered, affecting its mechanical properties and nucleation of cracks.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "HESLOP AND PETCH", "label": "HESLOP AND PETCH", "shape": "dot", "title": "HESLOP AND PETCH\ntype: PERSON\nsource: tanaka1981\ndegree: 1\nHeslop and Petch are researchers who demonstrated the relationship between grain size and ductile-to-brittle transition temperature.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "T_{RS}", "label": "T_{RS}", "shape": "dot", "title": "T_{RS}\ntype: PHASE\nsource: tanaka1981\ndegree: 10\nT_{rs} represents the transition temperature as a function of various metallurgical parameters and compositions.", "value": 17.692307692307693}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "KUNITAKE", "label": "KUNITAKE", "shape": "dot", "title": "KUNITAKE\ntype: PERSON\nsource: tanaka1981\ndegree: 1\nKunitake is a researcher who contributed to the understanding of transition temperatures in martensitic structures.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "GLADMAN", "label": "GLADMAN", "shape": "dot", "title": "GLADMAN\ntype: PERSON\nsource: tanaka1981\ndegree: 1\nGladman is a researcher who established the transition temperature equations for bainitic steel.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "FINISHING TEMPERATURE", "label": "FINISHING TEMPERATURE", "shape": "dot", "title": "FINISHING TEMPERATURE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nFinishing temperature is the temperature at which steel is processed, significantly impacting its mechanical properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DISLOCATIONS", "label": "DISLOCATIONS", "shape": "dot", "title": "DISLOCATIONS\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nDislocations are defects in the crystal structure of materials that affect their mechanical strength and ductility.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "\u03a3_{D}", "label": "\u03a3_{D}", "shape": "dot", "title": "\u03a3_{D}\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 2\n\u03c3_{D} is a parameter representing Ashby-Orowan strengthening effects on the yield strength of materials.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "N_{B}(C, N)", "label": "N_{B}(C, N)", "shape": "dot", "title": "N_{B}(C, N)\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 1\nNb(C, N) refers to niobium carbonitride precipitates that influence dislocation and recovery mechanisms in Nb steel.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "C-MN STEEL", "label": "C-MN STEEL", "shape": "dot", "title": "C-MN STEEL\ntype: STEEL GRADE\nsource: tanaka1981\ndegree: 7\nC-MN STEEL is a type of low-carbon low alloy steel distinguished by its favorable mechanical properties, which are largely a result of its phase structure. This category of steel exhibits excellent workability and toughness, making it a favored choice in various industrial applications. One of the key attributes of C-MN STEEL includes its unique characteristics in dislocation hardening and recover...", "value": 15.384615384615385}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SUBGRAINS", "label": "SUBGRAINS", "shape": "dot", "title": "SUBGRAINS\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nSubgrains are smaller grains formed from the division of larger grains in a material and influence its mechanical properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "BAINITIC STEEL", "label": "BAINITIC STEEL", "shape": "dot", "title": "BAINITIC STEEL\ntype: STEEL GRADE\nsource: tanaka1981\ndegree: 1\nBainitic steel is a type of steel with a specific microstructure that provides a balance between strength and ductility.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "HIGH-ANGLE BOUNDARY", "label": "HIGH-ANGLE BOUNDARY", "shape": "dot", "title": "HIGH-ANGLE BOUNDARY\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nHigh-angle boundaries are types of grain boundaries that can impede crack propagation, enhancing toughness.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "LOW-ANGLE BOUNDARY", "label": "LOW-ANGLE BOUNDARY", "shape": "dot", "title": "LOW-ANGLE BOUNDARY\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nLow-angle boundaries are less effective at obstructing dislocation movement compared to high-angle boundaries, affecting the ductility of steel.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "V", "label": "V", "shape": "dot", "title": "V\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 1\nVanadium (V) is an alloying element that contributes significantly to strength and transition temperature via precipitation hardening in steel.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TI", "label": "TI", "shape": "dot", "title": "TI\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 1\nTitanium (Ti) is an alloying element that helps to refine grain size and can affect the recrystallization process in steel, although large additions can decrease toughness.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "STRAIN-INDUCED PRECIPITATES", "label": "STRAIN-INDUCED PRECIPITATES", "shape": "dot", "title": "STRAIN-INDUCED PRECIPITATES\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nStrain-induced precipitates are fine particles formed in steel during deformation that can inhibit grain growth and enhance strength without degrading toughness.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SI", "label": "SI", "shape": "dot", "title": "SI\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 1\nSilicon (Si) is an alloying element that improves strength and ductility in controlled-rolled steel, particularly when used in amounts of 0.3\u20130.5%.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "MANGANESE", "label": "MANGANESE", "shape": "dot", "title": "MANGANESE\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 2\nManganese (Mn) is a crucial alloying element in structural steel, known for its significant role in enhancing material strength through processes such as solid-solution hardening and grain refinement. It achieves this by lowering the transformation temperature, which is vital for improving the mechanical properties of steel. The incorporation of manganese not only contributes to the overall streng...", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ALPHA-MATRIX", "label": "ALPHA-MATRIX", "shape": "dot", "title": "ALPHA-MATRIX\ntype: PHASE\nsource: tanaka1981\ndegree: 1\nThe alpha-matrix is a phase of steel characterized by its body-centered cubic (BCC) structure, playing a crucial role in the mechanical properties and toughness of the material.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "GAMMA-RECRYSTALLIZATION", "label": "GAMMA-RECRYSTALLIZATION", "shape": "dot", "title": "GAMMA-RECRYSTALLIZATION\ntype: PHASE\nsource: tanaka1981\ndegree: 1\nGamma-recrystallization refers to the process where the gamma phase in steel transitions to other phases during heating and deformation, affecting the overall strength and structure.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "MOLYBDENUM", "label": "MOLYBDENUM", "shape": "dot", "title": "MOLYBDENUM\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 3\nMolybdenum is a crucial alloying element used predominantly in the steel industry to enhance the mechanical properties of steel. It plays a significant role in increasing the strength of steel primarily through a process known as transformation hardening. This process contributes to the development of acicular ferrite steel, a type of steel renowned for its high strength and toughness. \n\nIn additi...", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ACICULAR FERRITE STEEL", "label": "ACICULAR FERRITE STEEL", "shape": "dot", "title": "ACICULAR FERRITE STEEL\ntype: STEEL GRADE\nsource: tanaka1981\ndegree: 1\nAcicular ferrite steel is characterized by its unique microstructure that enhances strength, influenced by the addition of molybdenum.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PLATE MILL", "label": "PLATE MILL", "shape": "dot", "title": "PLATE MILL\ntype: EQUIPMENT\nsource: tanaka1981\ndegree: 1\nThe plate mill is a type of rolling mill that has challenges with reduction per pass, especially during initial slab rolling.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "HOT-STRIP MILL", "label": "HOT-STRIP MILL", "shape": "dot", "title": "HOT-STRIP MILL\ntype: EQUIPMENT\nsource: tanaka1981\ndegree: 1\nA hot-strip mill can achieve significant reduction per pass, producing finer and more uniform grain structures than a plate mill.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CHROMIUM", "label": "CHROMIUM", "shape": "dot", "title": "CHROMIUM\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 1\nChromium suppresses the formation of a banded structure in steel, preventing separations and aiding in the formation of fine precipitates when used with Nb or V.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "COPPER", "label": "COPPER", "shape": "dot", "title": "COPPER\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 1\nCopper has a negligible effect on properties in controlled-rolled steel but can be effective in combination with other elements like Nb and V.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "NICKEL", "label": "NICKEL", "shape": "dot", "title": "NICKEL\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 1\nNickel (Ni) is a significant metallurgical element primarily recognized for its role as an alloying agent that enhances the properties of steel. It is particularly valued for improving the toughness and strength of steel products. In the context of controlled-rolled steel production, nickel\u0027s concentration is typically limited to 0.3% or less. At this lower percentage, nickel has a minimal impact ...", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "VANADIUM", "label": "VANADIUM", "shape": "dot", "title": "VANADIUM\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 2\nVanadium is a crucial alloying element extensively utilized in steel production, recognized for its significant contributions to enhancing the material\u0027s hardness and strength, especially in hot-rolled applications. Through the alloying process, vanadium plays a vital role in grain refinement, which is essential for achieving improved mechanical properties in steel products. This is accomplished t...", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PASS SCHEDULE", "label": "PASS SCHEDULE", "shape": "dot", "title": "PASS SCHEDULE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nThe pass schedule is a process parameter in rolling mills that defines the sequence of operations for reducing material thickness and achieving desired microstructure.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ROLLING TEMPERATURE", "label": "ROLLING TEMPERATURE", "shape": "dot", "title": "ROLLING TEMPERATURE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nRolling temperature is a crucial process parameter in steel manufacturing, influencing the microstructure and mechanical properties of the final product.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "LOW-CARBON STEEL", "label": "LOW-CARBON STEEL", "shape": "dot", "title": "LOW-CARBON STEEL\ntype: STEEL GRADE\nsource: tanaka1981\ndegree: 8\nLow-carbon steel is defined as a type of steel that comprises a carbon content of less than or equal to 0.06%. This low percentage of carbon imparts distinct properties, particularly ductility, which allows it to be shaped and formed easily, making it suitable for a wide range of applications. Due to its characteristics, low-carbon steel is widely utilized in various steel processing methods, demo...", "value": 16.153846153846153}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "FINISH ROLLING", "label": "FINISH ROLLING", "shape": "dot", "title": "FINISH ROLLING\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nFinish rolling is the final stage of the rolling process that shapes the metal piece into its final dimensions and properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CEMENTITE", "label": "CEMENTITE", "shape": "dot", "title": "CEMENTITE\ntype: PHASE\nsource: tanaka1981\ndegree: 1\nCementite, or iron carbide, is a hard material found in steel that affects its mechanical properties, particularly toughness and hardness.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "POLYGONAL FERRITE", "label": "POLYGONAL FERRITE", "shape": "dot", "title": "POLYGONAL FERRITE\ntype: PHASE\nsource: tanaka1981\ndegree: 3\nPolygonal Ferrite is a phase observed in steel that can influence the material\u0027s overall mechanical properties depending on its volume fraction in the microstructure.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DUAL-PHASE STEEL", "label": "DUAL-PHASE STEEL", "shape": "dot", "title": "DUAL-PHASE STEEL\ntype: MATERIAL\nsource: tanaka1981\ndegree: 2\nDual-Phase Steel refers to a type of steel that has a microstructure consisting of \u03b1-grains and martensite islands, characterized by specific yield and tensile strength properties.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "FINISH-ROLLING TEMPERATURE", "label": "FINISH-ROLLING TEMPERATURE", "shape": "dot", "title": "FINISH-ROLLING TEMPERATURE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 2\nFinish-Rolling Temperature refers to the specific temperature at which steel is rolled to affect its microstructure and alter its mechanical properties.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "WORK HARDENING", "label": "WORK HARDENING", "shape": "dot", "title": "WORK HARDENING\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nWork Hardening refers to the process where a material increases in hardness and strength through plastic deformation.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "FINE-GRAINED POLYGONAL FERRITE", "label": "FINE-GRAINED POLYGONAL FERRITE", "shape": "dot", "title": "FINE-GRAINED POLYGONAL FERRITE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 2\nFine-grained polygonal ferrite refers to a microstructure which consists of very small ferrite grains resulting from controlled deformation processes, enhancing strength and toughness.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "STRENGTH", "label": "STRENGTH", "shape": "dot", "title": "STRENGTH\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 2\nStrength is a critical mechanical property of materials that quantifies their ability to withstand an applied force or load without failure.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TOUGHNESS", "label": "TOUGHNESS", "shape": "dot", "title": "TOUGHNESS\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 4\nToughness is a significant mechanical property that characterizes a material\u0027s ability to absorb energy while undergoing plastic deformation without fracturing. This property is essential in various steel applications, as it ensures that the material can endure stress and impact without breaking. Toughness allows materials, particularly metals, to maintain structural integrity under dynamic loads,...", "value": 13.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "NORMALIZING", "label": "NORMALIZING", "shape": "dot", "title": "NORMALIZING\ntype: PROCESS\nsource: tanaka1981\ndegree: 3\nNormalizing is a heat treatment process that involves heating steel to a temperature where it becomes austenitic, followed by cooling in air to refine its microstructure.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "QUENCHING", "label": "QUENCHING", "shape": "dot", "title": "QUENCHING\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nQuenching is a rapid cooling process used in metallurgy to harden steel by transforming austenite into martensite.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TEMPERING", "label": "TEMPERING", "shape": "dot", "title": "TEMPERING\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nTempering is a heat treatment process applied to quenched steel to reduce brittleness and increase toughness by allowing some of the martensite to transform.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DEFORMATION BANDS", "label": "DEFORMATION BANDS", "shape": "dot", "title": "DEFORMATION BANDS\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 3\nDeformation bands are structural features that emerge during the plastic deformation of materials. These bands play a significant role in influencing the nucleation of new phases as materials undergo cooling processes. Their formation occurs under various mechanical processes, including rolling, where they affect the microstructural properties and overall mechanical performance of the material.\n\nS...", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SUPRAPOSITION", "label": "SUPRAPOSITION", "shape": "dot", "title": "SUPRAPOSITION\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nSupraposition effects in thermomechanical treatments refer to the combined influences of different processes (like controlled rolling and transformation) to optimize material properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CHARPY TEST", "label": "CHARPY TEST", "shape": "dot", "title": "CHARPY TEST\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nThe Charpy test is a standardized high-strain-rate test to determine the amount of energy absorbed by a material during fracture.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "EFFECT OF FINISHING TEMPERATURE", "label": "EFFECT OF FINISHING TEMPERATURE", "shape": "dot", "title": "EFFECT OF FINISHING TEMPERATURE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nThe effect of finishing temperature on steel properties impacts yield strength and transition temperature, indicating how thermal processes influence material performance.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "LOW-TEMPERATURE RANGE", "label": "LOW-TEMPERATURE RANGE", "shape": "dot", "title": "LOW-TEMPERATURE RANGE\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nThe low-temperature range refers to the temperature conditions under which controlled rolling enhances the strength and toughness of steel by refining its microstructure.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "HEAVY, REPEATED DEFORMATIONS", "label": "HEAVY, REPEATED DEFORMATIONS", "shape": "dot", "title": "HEAVY, REPEATED DEFORMATIONS\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nHeavy, repeated deformations in steel processing are used to achieve grain refinement, contributing to increased strength and toughness of steel products.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "THROUGH-THICKNESS EMBRITTLEMENT", "label": "THROUGH-THICKNESS EMBRITTLEMENT", "shape": "dot", "title": "THROUGH-THICKNESS EMBRITTLEMENT\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nThrough-thickness embrittlement occurs in rolled steels, particularly affecting toughness, where weakened structural integrity leads to failure in certain directions.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "STRAIN-INDUCED PRECIPITATION", "label": "STRAIN-INDUCED PRECIPITATION", "shape": "dot", "title": "STRAIN-INDUCED PRECIPITATION\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nStrain-induced precipitation is a significant phenomenon in materials science that occurs when new phases develop within the microstructure of a material as a result of applied stress. This process typically takes place during deformation and involves the formation of precipitates, which are secondary phases that emerge within the matrix of the material. \n\nThe formation of these precipitates plays...", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SOLUTE-DRAG EFFECT", "label": "SOLUTE-DRAG EFFECT", "shape": "dot", "title": "SOLUTE-DRAG EFFECT\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nThe solute-drag effect refers to the resistance to dislocation motion caused by solute atoms, which can strengthen the material during deformation processes.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DISLOCATION", "label": "DISLOCATION", "shape": "dot", "title": "DISLOCATION\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 1\nDislocations are defects within the crystal structure of materials that play a significant role in plastic deformation and the overall strength of metals.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "PROCESS VARIABLES", "label": "PROCESS VARIABLES", "shape": "dot", "title": "PROCESS VARIABLES\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nProcess variables are the various factors in processing\u2014such as temperature, strain rate, and composition\u2014that impact the final properties of the material.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "COOLING", "label": "COOLING", "shape": "dot", "title": "COOLING\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nCooling is the process applied after deformation, such as in quenching, to achieve desired microstructures like martensite in steels.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "I. KOZASU", "label": "I. KOZASU", "shape": "dot", "title": "I. KOZASU\ntype: PERSON\nsource: tanaka1981\ndegree: 4\nI. Kozasu is a researcher recognized for his contributions to the field of metallurgy, particularly in understanding the properties of steel. He has co-authored a number of papers that explore the characteristics and behaviors of steel and its alloys, which have been published in various prestigious metallurgical journals. His work includes a significant focus on alloy microstructures, underscorin...", "value": 13.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "H. SEKINE", "label": "H. SEKINE", "shape": "dot", "title": "H. SEKINE\ntype: PERSON\nsource: tanaka1981\ndegree: 3\nH. Sekine is a co-author in works about microstructures and alloy design.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "H. KUBOTA", "label": "H. KUBOTA", "shape": "dot", "title": "H. KUBOTA\ntype: PERSON\nsource: tanaka1981\ndegree: 1\nH. Kubota is a researcher involved in studies published in the Transactions of the Iron and Steel Institute of Japan.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "T. MARUYAMA", "label": "T. MARUYAMA", "shape": "dot", "title": "T. MARUYAMA\ntype: PERSON\nsource: tanaka1981\ndegree: 1\nT. Maruyama has co-authored several studies related to the microstructure and mechanical properties of alloys.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "UNION CARBIDE CORPORATION", "label": "UNION CARBIDE CORPORATION", "shape": "dot", "title": "UNION CARBIDE CORPORATION\ntype: ORGANIZATION\nsource: tanaka1981\ndegree: 4\nUnion Carbide Corporation is a prominent chemical company that has made significant contributions across various industrial sectors, particularly in the fields of chemistry and materials. The organization is renowned for its production of materials and technology that play a crucial role in the chemicals and materials industries. Union Carbide\u0027s research initiatives have notably impacted metallurg...", "value": 13.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "THE IRON AND STEEL INSTITUTE OF JAPAN", "label": "THE IRON AND STEEL INSTITUTE OF JAPAN", "shape": "dot", "title": "THE IRON AND STEEL INSTITUTE OF JAPAN\ntype: ORGANIZATION\nsource: tanaka1981\ndegree: 1\nThis organization is involved in                           var widthFactor = params.iterations/params.total;
                          var width = Math.max(minWidth,maxWidth * widthFactor);
                          document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
