HASE\nsource: tanaka1981\ndegree: 5\nFerrite is a body-centered cubic phase of iron and steel, recognized for its soft and ductile characteristics. This phase is typically present in low-carbon steels, playing a crucial role in enhancing the mechanical properties of these alloys. Ferrite is more stable at lower temperatures compared to its counterpart, austenite, and it generally forms during the cooling process of austenite.\n\nIn the...", "value": 13.846153846153847}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "MECHANICAL PROPERTIES", "label": "MECHANICAL PROPERTIES", "shape": "dot", "title": "MECHANICAL PROPERTIES\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 10\nMechanical properties refer to the physical attributes of materials that determine their behavior under applied forces. These properties include key characteristics such as strength, toughness, ductility, and hardness. Strength is the ability of a material to withstand an applied load without failure, while toughness measures a material\u0027s capacity to absorb energy and deform plastically before fra...", "value": 17.692307692307693}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "NOTCH TOUGHNESS", "label": "NOTCH TOUGHNESS", "shape": "dot", "title": "NOTCH TOUGHNESS\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 4\nNotch toughness is a vital mechanical property that quantifies a material\u0027s ability to endure stress concentrations and impact loading without experiencing breakage. This characteristic is crucial in engineering and materials science, as it reflects how well a material can resist failure when subjected to forces that could create flaws or weaknesses. The measurement of notch toughness is essential...", "value": 13.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "NIOBIUM", "label": "NIOBIUM", "shape": "dot", "title": "NIOBIUM\ntype: ALLOYING ELEMENT\nsource: tanaka1981\ndegree: 6\nNiobium (Nb) is a valuable alloying naka1981\ndegree: 1\nThe \u03b1-matrix is the ferritic phase of steel that forms upon cooling from the austenitic phase and affects strength and toughness.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "HALL-PETCH RELATION", "label": "HALL-PETCH RELATION", "shape": "dot", "title": "HALL-PETCH RELATION\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 2\nThe Hall-Petch relation is a fundamental principle in materials science that describes the relationship between grain size and yield strength in polycrystalline materials. According to this relation, as the grain size decreases, the yield strength of the material increases. This phenomenon occurs because smaller grains provide more grain boundaries, which act as barriers to dislocation motion\u2014a pr...", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "COARSE \u0393", "label": "COARSE \u0393", "shape": "dot", "title": "COARSE \u0393\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nCoarse \u03b3 refers to the larger grains of the austenite phase in steel, which can negatively affect toughness when transformed into a mixture of coarse \u03b1 and bainite.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "BAINITE", "label": "BAINITE", "shape": "dot", "title": "BAINITE\ntype: PHASE\nsource: tanaka1981\ndegree: 5\nBainite is a microstructural phase that forms in steel during the cooling process, significantly influencing its mechanical properties and toughness. This unique microstructure consists of both ferrite and cementite, contributing to its beneficial characteristics. The formation of bainite occurs at specific temperatures, typically between those required for the formation of pearlite and martensite...", "value": 13.846153846153847}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "C\u2014MN\u2014NB FINE-GRAINED STEEL", "label": "C\u2014MN\u2014NB FINE-GRAINED STEEL", "shape": "dot", nt": {"color": "#222222"}, "id": "UPPER BAINITE", "label": "UPPER BAINITE", "shape": "dot", "title": "UPPER BAINITE\ntype: PHASE\nsource: tanaka1981\ndegree: 2\nUpper bainite is a microstructural feature in steel that can form during specific cooling rates and transformations, typically characterized by its coarse structure when produced less effectively during metalworking.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "FINER GRAIN STRUCTURE", "label": "FINER GRAIN STRUCTURE", "shape": "dot", "title": "FINER GRAIN STRUCTURE\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 4\nFiner grain structure is a beneficial mechanical property in metals that improves strength and toughness, commonly achieved through specific thermal and deformation processes.", "value": 13.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "MIXED GRAIN STRUCTURE", "label": "MIXED GRAIN STRUCTURE", "shape": "dot", "title": "MIXED GRAIN STRUCTURE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 4\nThe term \"Mixed Grain Structure\" refers to a material characteristic that encompasses a variety of grain sizes and types, significantly influencing the mechanical properties of the material. This structure often arises from processes like incomplete recrystallization or mixed processing conditions, which can lead to a combination of fine and coarse alpha-grains, particularly in steel. A mixed grai...", "value": 13.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TOTAL REDUCTION", "label": "TOTAL REDUCTION", "shape": "dot", "title": "TOTAL REDUCTION\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 1\nTotal reduction is a key parameter in metalworking processes that quantifies the extent of deformation the material undergoes, affecting its final grain structure and properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "WARM-WORKED", "label": "WARM-WORKED", "shape": "dot", "title": "WARM-WORKED\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nWarm-worked refers to a microstructure and processing technique where steel is deformed at temperatures below the recrystallization temperature, influencing its structural properties and grain size.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "FERITE-PEARLITE", "label": "FERITE-PEARLITE", "shape": "dot", "title": "FERITE-PEARLITE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nFerrite-pearlite is a microstructure in steel that forms during cooling after austenitization, characterized by alternating layers of ferrite and pearlite contributing to overall strength.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DEFORMATION BAND", "label": "DEFORMATION BAND", "shape": "dot", "title": "DEFORMATION BAND\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 5\nDeformation bands are structures that form in steel during deformation, influencing nucleation sites for phase transformations.", "value": 13.846153846153847}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SUBGRAIN HARDENING", "label": "SUBGRAIN HARDENING", "shape": "dot", "title": "SUBGRAIN HARDENING\ntype: PROCESS PARAMETER\nsource: tanaka1981\ndegree: 4\nSubgrain hardening is a mechanism through which dislocations within the microstructure create barriers to further deformation, enhancing strength.", "value": 13.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "CLASSIC HOT ROLLING", "label": "CLASSIC HOT ROLLING", "shape": "dot", "title": "CLASSIC HOT ROLLING\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nClassic hot rolling is a traditional process in which steel is rolled at high temperatures, affecting the grain structure and material properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "TANAKA", "label": "TANAKA", "shape": "dot", "title": "TANAKA\ntype: PERSON\nsource: tanaka1981\ndegree: 7\nT. Tanaka is a prominent researcher specializing in the structure and properties of dual-phase steels, significantly contributing to the understanding of these materials through various studies. Tanaka\u0027s work encompasses the controlled rolling of steel processes, wherein he has examined the effects of rolling techniques on the mechanical properties of steel. \n\nA noteworthy aspect of Tanaka\u0027s resea...", "value": 15.384615384615385}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "RECRYSTALLIZATION REGION", "label": "RECRYSTALLIZATION REGION", "shape": "dot", "title": "RECRYSTALLIZATION REGION\ntype: PHASE\nsource: tanaka1981\ndegree: 4\nThe \"recrystallization region\" refers to a specific temperature range in which new grains form in a material as a result of heating and deformation. This region is essential in various material processes, particularly in the field of metallurgy. Within the recrystallization region, materials, especially metals such as steel, undergo dynamic recrystallization during deformation. This process leads ...", "value": 13.076923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "MEDIUM HARDENABILITY", "label": "MEDIUM HARDENABILITY", "shape": "dot", "title": "MEDIUM HARDENABILITY\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 1\nMedium hardenability refers to the capacity of steel to harden when cooled, which can be influenced by its microstructure and processing.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "BAINITIC STRUCTURE", "label": "BAINITIC STRUCTURE", "shape": "dot", "title": "BAINITIC STRUCTURE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nThe \"Bainitic structure\" in steel refers to a specific microstructural arrangement that significantly influences the mechanical properties of the material. This structure is characterized by a unique combination of ferrite and cementite, which contributes to enhanced toughness. However, the formation of bainitic structure is highly dependent on the cooling rates during the steel\u0027s production proce...", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "EQUIAXED GRAINS", "label": "EQUIAXED GRAINS", "shape": "dot", "title": "EQUIAXED GRAINS\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nEquiaxed grains refer to grains that are approximately the same size in all directions, contributing to better material properties in steel.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "MICROSTRUCTURAL CHANGE", "label": "MICROSTRUCTURAL CHANGE", "shape": "dot", "title": "MICROSTRUCTURAL CHANGE\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 1\nMicrostructural change occurs during processes like controlled rolling and deformation, affecting the properties of materials.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "HARDENABILITY", "label": "HARDENABILITY", "shape": "dot", "title": "HARDENABILITY\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 2\nHardenability describes the ability of steel to harden in response to cooling, which is affected by its microstructure.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "RECRYSTALLIZATION", "label": "RECRYSTALLIZATION", "shape": "dot", "title": "RECRYSTALLIZATION\ntype: PHENOMENON\nsource: tanaka1981\ndegree: 20\nRecrystallization is a significant phenomenon that occurs in metals, particularly steel, where deformed grains are replaced by a new set of unstrained grains. This process typically happens during heating or mechanical working of the material. The transformation of deformed grains to strain-free grains plays a critical role in altering the material\u0027s properties, including its strength, ductility, ...", "value": 25.384615384615387}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "FLOW STRESS", "label": "FLOW STRESS", "shape": "dot", "title": "FLOW STRESS\ntype: MECHANICAL PROPERTY\nsource: tanaka1981\ndegree: 2\nFlow stress is the stress required to maintain plastic deformation in steel during processing, influencing the deformation behavior.", "value": 11.538461538461538}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "SUBSTRUCTURE", "label": "SUBSTRUCTURE", "shape": "dot", "title": "SUBSTRUCTURE\ntype: MICROSTRUCTURE\nsource: tanaka1981\ndegree: 1\nSubstructure refers to the arrangement of dislocations and defects within a material\u0027s grains that influence overall strength and properties.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DYNAMIC RECOVERY", "label": "DYNAMIC RECOVERY", "shape": "dot", "title": "DYNAMIC RECOVERY\ntype: PROCESS\nsource: tanaka1981\ndegree: 3\nA process occurring during deformation of metals where dislocations are rearranged and recrystallized at high temperatures, leading to the reduction of internal stress.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "DYNAMIC RECRYSTALLIZATION", "label": "DYNAMIC RECRYSTALLIZATION", "shape": "dot", "title": "DYNAMIC RECRYSTALLIZATION\ntype: PROCESS\nsource: tanaka1981\ndegree: 3\nA process that occurs when metals are deformed at high temperatures where new, strain-free grains form during deformation, influencing flow stress.", "value": 12.307692307692307}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "STATIC RESTORATION", "label": "STATIC RESTORATION", "shape": "dot", "title": "STATIC RESTORATION\ntype: PROCESS\nsource: tanaka1981\ndegree: 1\nProcesses that occur after deformation at elevated temperatures, including static recovery, static recrystallization, and metadynamic recrystallization to restore the material\u0027s microstructure.", "value": 10.76923076923077}, {"color": "#1f77b4", "font": {"color": "#222222"}, "id": "ZENER\u2013HOLLIMON PARAMETER", "label": "ZENER\u20
