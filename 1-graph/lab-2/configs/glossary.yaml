critical_points:
  - pattern: '\$\s*(\d+)\s*\^\s*\{?\s*\\circ\s*\}?\s*\$\s*[–-]\s*\$\s*(\d+)\s*\^\s*\{?\s*\\circ\s*\}?\s*\$\s*C\b'
    target: '\1–\2 °C'
  - pattern: '\$\s*(\d+)\s*\^\s*\{?\s*\\circ\s*\}?\s*\$\s*C\b'
    target: '\1 °C'
  - pattern: '(\d)°(?=\s+to\s+\d)'
    target: '\1 °C'
  - pattern: '\$\s*\\mathbf\s*\{\s*A\s*r\s*\}\s*_\s*\{\s*3\s*\}\s*(,?)\s*\$'
    target: 'Ar3\1'
  - pattern: '\$\s*\\mathbf\s*\{\s*A\s*\}\s*_\s*\{\s*\\mathrm\s*\{\s*r\s*\}\s*3\s*\}\s*\$'
    target: 'Ar3'
  - pattern: '\$\s*\\mathrm\s*\{\s*A\s*c\s*\}\s*_\s*\{\s*3\s*\}\s*\$'
    target: 'Ac3'
  - pattern: '\$\s*A([rc])_\{?\s*(\d)\s*\}?\s*\$'
    target: 'A\1\2'
greek:
  gamma: γ
  alpha: α
  delta: δ
unit_replacements:
  - pattern: '(?<=\d)\s*–\s+(?=\d)'
    target: '–'
  - pattern: ',\s*,'
    target: ','
  - pattern: '<sup>\s*[0o°]\s*</sup>\s*[СC]'
    target: ' °C'
  - pattern: '(?<=\d)\s*°\s*[СC](?![a-zа-я])'
    target: ' °C'
  - pattern: '(?<=[\d–])\s?С(?=[)\s.,;]|$)'
    target: ' °C'
  - pattern: '°C\s*/\s*сек\b'
    target: '°C/с'
  - pattern: '\bсек\b'
    target: 'с'
  - pattern: '(?<=\d)\s*с/сек\b'
    target: ' с'
  - pattern: '\b([Nn])/mm2\b'
    target: '\1/mm²'
  - pattern: '\bkg/mm2\b'
    target: 'kg/mm²'
  - pattern: '(?<=\d)\s*мм\b'
    target: ' мм'
  - pattern: '(?<=\d)\s*÷\s*(?=\d)'
    target: '–'
  - pattern: '(?<=\d)\s?-\s?(?=\d)'
    target: '–'
  - pattern: '(?<=[γαδ]) +-(?=[^\W\d_])'
    target: '-'
  - pattern: '</?sub>'
    target: ''
  - pattern: '\*\*'
    target: ''
abbreviations:
  - short: КП
    long: контролируемая прокатка
    en: controlled rolling
  - short: КПУО
    long: контролируемая прокатка с ускоренным охлаждением
    en: controlled rolling with accelerated cooling
  - short: УОВТ
    long: ''
    en: accelerated cooling unit
  - short: УО
    long: ускоренное охлаждение
    en: accelerated cooling
  - short: СМУО
    long: система многоцелевого ускоренного охлаждения
    en: multipurpose accelerated cooling system
  - short: ТМО
    long: термомеханическая обработка
    en: thermomechanical treatment
  - short: HSLA
    long: high-strength low-alloy
    en: high-strength low-alloy
  - short: RPT
    long: recrystallization–precipitation–time
    en: recrystallization–precipitation–time
  - short: RD
    long: rolling direction
    en: rolling direction
  - short: ND
    long: normal direction
    en: normal direction
  - short: TD
    long: transverse direction
    en: transverse direction
