[project]
name = "lab2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "networkx>=3.5",
    "numpy>=2.3",
    "pandas>=2.3",
    "pyarrow>=21",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "pyyaml>=6.0",
    "scikit-learn>=1.7",
    "tiktoken>=0.12",
    "tokenizers>=0.22",
    "wordfreq>=3.1",
    "matplotlib>=3.10",
    "python-pptx>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[project.scripts]
lab2 = "lab2.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab2"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
