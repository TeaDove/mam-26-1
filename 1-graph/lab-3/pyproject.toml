[project]
name = "lab3"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "matplotlib>=3.9",
    "networkx>=3.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-pptx>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.3",
    "torch>=2.9",
    "torch-geometric>=2.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
lab3 = "lab3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab3"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
